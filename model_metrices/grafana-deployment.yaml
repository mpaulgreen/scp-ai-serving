---
# Grafana Deployment for LLM Monitoring
#
# This manifest deploys Grafana in the custom-monitoring namespace with:
# - Prometheus datasource pre-configured
# - Auto-import of dashboards from ConfigMaps
# - Persistent storage for dashboard customizations
# - Route for external access
#
# Prerequisites:
#   - OpenShift user-workload monitoring enabled
#   - custom-monitoring namespace exists
#
# Usage:
#   oc apply -f grafana-deployment.yaml
#

---
# Secret for Grafana admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: custom-monitoring
type: Opaque
stringData:
  # Change these credentials in production
  username: admin
  password: admin123

---
# ServiceAccount for Grafana
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: custom-monitoring

---
# Secret for ServiceAccount token (used to authenticate with Prometheus)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-token
  namespace: custom-monitoring
  annotations:
    kubernetes.io/service-account.name: grafana
type: kubernetes.io/service-account-token

---
# ClusterRoleBinding - grants Grafana read access to Prometheus metrics
# Uses the built-in cluster-monitoring-view ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-prometheus-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view  # Built-in OpenShift ClusterRole
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: custom-monitoring

---
# PersistentVolumeClaim for Grafana data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: custom-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3-csi  # Change to your cluster's storage class

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: custom-monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate  # Use Recreate instead of RollingUpdate for ReadWriteOnce PVC
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana

      # Pod-level security context for OpenShift compatibility
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              name: http
              protocol: TCP

          # Container-level security context
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          env:
            # Admin credentials from secret
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password

            # ServiceAccount token for Prometheus authentication
            - name: BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-token
                  key: token

            # Grafana settings
            - name: GF_INSTALL_PLUGINS
              value: ""

            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning

            # Allow anonymous access (read-only)
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"

            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"

            # Disable telemetry
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            # Persistent storage for dashboards and settings
            - name: grafana-storage
              mountPath: /var/lib/grafana

            # Dashboard provisioning directory
            - name: grafana-dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards

      volumes:
        # PVC for persistent storage
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage

        # Dashboard provisioning config
        - name: grafana-dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning

---
# ConfigMap for dashboard auto-provisioning
# Note: Automatic provisioning is disabled. Import dashboards manually via Grafana UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: custom-monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers: []

---
# Service for Grafana
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: custom-monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: grafana

---
# Route for external access (OpenShift)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  namespace: custom-monitoring
  labels:
    app: grafana
spec:
  to:
    kind: Service
    name: grafana
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
